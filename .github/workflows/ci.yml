name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et lancer TOUS les tests (unitaires + integration)
        run: mvn clean verify -B

      - name: Verifier que l'image Docker se construit toujours
        run: docker build -t asvosonk-app:ci .
