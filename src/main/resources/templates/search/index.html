<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle=${pageTitle}, content=~{::main-content}, extraHead=~{}, extraScripts=~{})}">
<body><th:block th:fragment="main-content">

<div class="page-header mb-4">
    <h2><i class="bi bi-search me-2"></i>Recherche globale</h2>
</div>

<div class="card border-0 shadow-sm mb-4" style="max-width:600px;">
    <div class="card-body p-4">
        <form th:action="@{/search}" method="get" class="d-flex gap-2">
            <input type="text" name="q" class="form-control"
                   th:value="${query}"
                   placeholder="Nom, téléphone…" autofocus>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-search me-1"></i>Rechercher
            </button>
        </form>
    </div>
</div>

<th:block th:if="${query != null}">
    <div class="mb-3">
        <span class="text-muted">
            Résultats pour « <strong th:text="${query}"></strong> »
            — <span th:text="${#lists.size(results)}"></span> trouvé(s)
        </span>
    </div>

    <th:block th:if="${#lists.isEmpty(results)}">
        <div class="alert alert-info">
            <i class="bi bi-info-circle me-1"></i>Aucun membre ne correspond à votre recherche.
        </div>
    </th:block>

    <th:block th:unless="${#lists.isEmpty(results)}">
        <div class="list-group shadow-sm">
            <a th:each="m : ${results}"
               th:href="@{'/members/' + ${m.id}}"
               class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                <span>
                    <i class="bi bi-person-fill me-2 text-primary"></i>
                    <span th:text="${m.fullName}">Nom</span>
                </span>
                <small class="text-muted" th:text="${m.phone}">Tél</small>
            </a>
        </div>
    </th:block>
</th:block>

</th:block></body></html>
