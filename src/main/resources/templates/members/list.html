<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
               xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(pageTitle='Membres', content=~{::main-content}, extraHead=~{}, extraScripts=~{})}">
<body><th:block th:fragment="main-content">

<div class="d-flex justify-content-between align-items-center mb-3">
    <div class="page-header">
        <h2><i class="bi bi-person-lines-fill me-2"></i>Membres</h2>
        <p th:text="${members.size()} + ' membres enregistrés'"></p>
    </div>
    <a th:href="@{/members/new}" class="btn btn-primary"
       sec:authorize="hasAuthority('MEMBER_CREATE')">
        <i class="bi bi-person-plus me-1"></i>Nouveau membre
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead>
                <tr>
                    <th>Nom complet</th>
                    <th>Téléphone</th>
                    <th>Date d'adhésion</th>
                    <th>Résident</th>
                    <th>Statut</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${members.empty}">
                    <td colspan="6" class="text-center text-muted py-4">Aucun membre enregistré</td>
                </tr>
                <tr th:each="m : ${members}">
                    <td class="fw-semibold" th:text="${m.fullName}"></td>
                    <td th:text="${m.phone ?: '—'}"></td>
                    <td th:text="${#temporals.format(m.joinDate, 'dd/MM/yyyy')}"></td>
                    <td>
                        <i class="bi" th:classappend="${m.resident ? 'bi-check-circle-fill text-success' : 'bi-dash-circle text-muted'}"></i>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${m.status.name() == 'active' ? 'bg-success' :
                                              (m.status.name() == 'suspended' ? 'bg-warning text-dark' : 'bg-secondary')}"
                              th:text="${m.statusLabel}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/members/{id}(id=${m.id})}" class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-eye me-1"></i>Détail
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body></html>
