<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
               xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout('Membres', ~{::main-content}, ~{}, ~{})}">
<body>
<th:block th:fragment="main-content">

<div class="page-head">
    <div>
        <h1><i class="bi bi-people" aria-hidden="true"></i>Membres</h1>
        <p class="page-subtitle">
            <span th:text="${members.size()}">0</span> membre(s) enregistré(s) ·
            <span th:text="${activeCount}">0</span> actif(s)
        </p>
    </div>
    <div class="page-actions" sec:authorize="hasAuthority('MEMBER_CREATE')">
        <a th:href="@{/members/new}" class="btn btn-primary">
            <i class="bi bi-person-plus" aria-hidden="true"></i>Nouveau membre
        </a>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <div class="row g-2 w-100 align-items-center">
            <div class="col-md-5">
                <label class="visually-hidden" for="memberSearch">Rechercher un membre</label>
                <div class="input-group input-group-sm">
                    <span class="input-group-text" aria-hidden="true"><i class="bi bi-search"></i></span>
                    <input type="search" id="memberSearch" class="form-control"
                           placeholder="Nom ou téléphone…"
                           data-filter-target="#membersTable" data-filter-count="#memberCount">
                </div>
            </div>
            <div class="col-md-4">
                <label class="visually-hidden" for="statusFilter">Filtrer par statut</label>
                <select id="statusFilter" class="form-select form-select-sm"
                        data-filter-target="#membersTable" data-filter-attr="status">
                    <option value="">Tous les statuts</option>
                    <option value="active">Actifs</option>
                    <option value="suspended">Suspendus</option>
                    <option value="resigned">Démissionnés</option>
                    <option value="deceased">Décédés</option>
                </select>
            </div>
            <div class="col-md-3 text-md-end text-muted small">
                <span id="memberCount" th:text="${members.size()}">0</span> résultat(s)
            </div>
        </div>
    </div>

    <div class="table-wrap">
        <table class="table table-hover" id="membersTable">
            <caption class="visually-hidden">Liste des membres de l'association</caption>
            <thead>
                <tr>
                    <th scope="col">Nom complet</th>
                    <th scope="col">Téléphone</th>
                    <th scope="col">Adhésion</th>
                    <th scope="col" class="text-center">Résident</th>
                    <th scope="col">Frais d'adhésion</th>
                    <th scope="col">Statut</th>
                    <th scope="col" class="text-end">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="m : ${members}" data-row
                    th:attr="data-status=${m.status.name()},
                             data-search=${m.fullName + ' ' + (m.phone ?: '')},
                             data-href=@{/members/{id}(id=${m.id})}">
                    <th scope="row" class="fw-semibold" th:text="${m.fullName}">Nom</th>
                    <td th:text="${m.phone ?: '—'}">—</td>
                    <td th:text="${#temporals.format(m.joinDate, 'dd/MM/yyyy')}">date</td>
                    <td class="text-center">
                        <i class="bi" aria-hidden="true"
                           th:classappend="${m.resident ? 'bi-check-circle-fill' : 'bi-dash-circle'}"
                           th:style="${m.resident ? 'color:var(--c-success)' : 'color:var(--c-border-strong)'}"></i>
                        <span class="visually-hidden" th:text="${m.resident ? 'Résident' : 'Non résident'}"></span>
                    </td>
                    <td>
                        <span class="pill pill-warning" th:if="${membersWithPendingFees.contains(m.id)}">
                            <i class="bi bi-hourglass-split" aria-hidden="true"></i>Reste à payer
                        </span>
                        <span class="pill pill-success" th:unless="${membersWithPendingFees.contains(m.id)}">
                            <i class="bi bi-check2" aria-hidden="true"></i>Soldés
                        </span>
                    </td>
                    <td>
                        <span th:replace="~{fragments/ui :: memberStatus(${m.status}, ${m.statusLabel})}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="@{/members/{id}(id=${m.id})}" class="btn btn-sm btn-outline-secondary">
                            Ouvrir<i class="bi bi-chevron-right" aria-hidden="true"></i>
                        </a>
                    </td>
                </tr>
                <tr th:replace="~{fragments/ui :: emptyRow(7, 'Aucun membre enregistré', ${members.empty})}"></tr>
                <tr data-filter-empty hidden>
                    <td colspan="7" class="text-center text-muted py-4">
                        Aucun membre ne correspond à votre recherche.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block>
</body>
</html>
