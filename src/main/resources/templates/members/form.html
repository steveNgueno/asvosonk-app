<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(${pageTitle}, ~{::main-content}, ~{}, ~{})}">
<body>
<th:block th:fragment="main-content">

<div class="page-head">
    <div>
        <h1>
            <i class="bi" th:classappend="${editMode ? 'bi-pencil-square' : 'bi-person-plus'}" aria-hidden="true"></i>
            <span th:text="${editMode ? 'Modifier le membre' : 'Nouveau membre'}">Membre</span>
        </h1>
        <p class="page-subtitle">
            Les informations d'identité du membre. Les frais d'adhésion sont initialisés
            automatiquement à l'enregistrement.
        </p>
    </div>
    <div class="page-actions">
        <a th:href="${editMode} ? @{/members/{id}(id=${memberId})} : @{/members}"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>Retour
        </a>
    </div>
</div>

<div class="card form-panel">
    <div class="card-body">
        <form th:action="${editMode} ? @{/members/{id}/edit(id=${memberId})} : @{/members/new}"
              th:object="${memberRequest}" method="post" novalidate>

            <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0" aria-hidden="true"></i>
                <span>Certaines informations sont invalides. Corrigez les champs signalés ci-dessous.</span>
            </div>

            <div class="mb-4">
                <label class="form-label req" for="fullName">Nom complet</label>
                <input type="text" id="fullName" class="form-control" th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'"
                       placeholder="ex. NKOU Jean-Pierre" autocomplete="name" required>
                <div class="invalid-feedback" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label" for="phone">Téléphone</label>
                <input type="tel" id="phone" class="form-control" th:field="*{phone}"
                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'"
                       placeholder="ex. +237 6 XX XX XX XX" autocomplete="tel">
                <div class="invalid-feedback" th:errors="*{phone}"></div>
            </div>

            <div class="mb-4">
                <label class="form-label req" for="joinDate">Date d'adhésion</label>
                <input type="date" id="joinDate" class="form-control" th:field="*{joinDate}"
                       th:classappend="${#fields.hasErrors('joinDate')} ? 'is-invalid'" required>
                <div class="invalid-feedback" th:errors="*{joinDate}"></div>
                <p class="form-text">Date à laquelle le membre a intégré l'association.</p>
            </div>

            <div class="form-check mb-4">
                <input type="checkbox" class="form-check-input" id="resident" th:field="*{resident}">
                <label class="form-check-label" for="resident">Résident à Nkou-Assi</label>
            </div>

            <div class="mb-4" th:if="${editMode}">
                <label class="form-label" for="status">Statut</label>
                <select id="status" class="form-select" th:field="*{status}">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name()}"></option>
                </select>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg" aria-hidden="true"></i>Enregistrer
                </button>
                <a th:href="${editMode} ? @{/members/{id}(id=${memberId})} : @{/members}"
                   class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

</th:block>
</body>
</html>
