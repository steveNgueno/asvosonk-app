<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle=${pageTitle}, content=~{::main-content}, extraHead=~{}, extraScripts=~{})}">
<body><th:block th:fragment="main-content">

<div class="page-header mb-4">
    <h2 th:text="${editMode ? 'Modifier le membre' : 'Nouveau membre'}"></h2>
</div>

<div class="card border-0 shadow-sm" style="max-width:600px;">
    <div class="card-body p-4">
        <form th:action="${editMode ? '/members/' + memberForm.id + '/edit' : '/members/new'}"
              th:object="${memberForm}" method="post">

            <div class="mb-3">
                <label class="form-label fw-semibold">Nom complet *</label>
                <input type="text" class="form-control" th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Téléphone</label>
                <input type="tel" class="form-control" th:field="*{phone}" placeholder="+237 6XX XXX XXX">
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Date d'adhésion *</label>
                <input type="date" class="form-control" th:field="*{joinDate}"
                       th:classappend="${#fields.hasErrors('joinDate')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{joinDate}"></div>
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" th:field="*{resident}" id="residentCheck">
                <label class="form-check-label" for="residentCheck">Résident Nkou-Assi</label>
            </div>

            <div class="mb-4" th:if="${editMode}">
                <label class="form-label fw-semibold">Statut</label>
                <select class="form-select" th:field="*{status}">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.name()}"></option>
                </select>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-save me-1"></i>Enregistrer
                </button>
                <a th:href="${editMode ? '/members/' + memberForm.id : '/members'}"
                   class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

</th:block></body></html>
