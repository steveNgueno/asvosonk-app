<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(pageTitle=${pageTitle}, content=~{::main-content}, extraHead=~{}, extraScripts=~{})}">
<body>
<th:block th:fragment="main-content">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">
        <i class="bi bi-people me-2"></i>Nouveau tour de présence
    </h1>
    <a th:href="@{/presence-tours}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Retour
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body">
        <form th:action="@{/presence-tours/new}" th:object="${form}" method="post" class="needs-validation">

            <div class="mb-3">
                <label for="startDate" class="form-label">Date de début <span class="text-danger">*</span></label>
                <input type="date" id="startDate" th:field="*{startDate}"
                       class="form-control" th:classappend="${#fields.hasErrors('startDate')} ? 'is-invalid' : ''" required />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Participants <span class="text-danger">*</span></label>
                <div class="table-responsive">
                    <table class="table table-sm table-hover align-middle" id="participantsTable">
                        <thead class="table-dark">
                            <tr>
                                <th style="width:40px">#</th>
                                <th>Membre</th>
                                <th style="width:120px">Ordre de passage</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="member, iter : ${members}">
                                <td th:text="${iter.index + 1}"></td>
                                <td>
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input member-checkbox"
                                               th:id="'member_' + ${member.id}"
                                               th:value="${member.id}"
                                               th:field="*{participantIds}" />
                                        <label class="form-check-label" th:for="'member_' + ${member.id}"
                                               th:text="${member.fullName}"></label>
                                    </div>
                                </td>
                                <td>
                                    <input type="number" class="form-control form-control-sm draw-order"
                                           th:id="'order_' + ${member.id}"
                                           th:name="'drawOrders[' + ${iter.index} + ']'"
                                           min="1" step="1" placeholder="Ordre" disabled />
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('participantIds')}" th:errors="*{participantIds}"></div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-plus-circle me-1"></i>Créer le tour
                </button>
                <a th:href="@{/presence-tours}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.querySelectorAll('.member-checkbox').forEach(cb => {
        cb.addEventListener('change', function() {
            const orderInput = document.getElementById('order_' + this.value);
            if (orderInput) {
                orderInput.disabled = !this.checked;
                if (!this.checked) orderInput.value = '';
            }
        });
    });
</script>

</th:block></body></html>
