<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(pageTitle=${pageTitle}, content=~{::main-content}, extraHead=~{}, extraScripts=~{})}">
<body>
<th:block th:fragment="main-content">

<div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h3 mb-0">
        <i class="bi bi-calendar-check me-2"></i>Tour de présence #<span th:text="${tour.id}"></span>
    </h1>
    <div>
        <a th:href="@{/presence-tours}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Retour
        </a>
    </div>
</div>

<!-- ── Tour info card ──────────────────────────────────── -->
<div class="card mb-4">
    <div class="card-body">
        <div class="row">
            <div class="col-md-3">
                <small class="text-muted">Date début</small>
                <p class="fw-bold mb-0" th:text="${tour.startDate}"></p>
            </div>
            <div class="col-md-3">
                <small class="text-muted">Date fin</small>
                <p class="fw-bold mb-0" th:text="${tour.endDate} != null ? ${tour.endDate} : '—'"></p>
            </div>
            <div class="col-md-3">
                <small class="text-muted">Participants</small>
                <p class="fw-bold mb-0" th:text="${participants.size()}"></p>
            </div>
            <div class="col-md-3">
                <small class="text-muted">Statut</small>
                <p class="mb-0">
                    <span th:if="${tour.isOpen()}" class="badge bg-success fs-6">En cours</span>
                    <span th:unless="${tour.isOpen()}" class="badge bg-secondary fs-6">Terminé</span>
                </p>
            </div>
        </div>
    </div>
</div>

<!-- ── Participants table ──────────────────────────────── -->
<h5 class="mb-2">Participants</h5>
<div class="table-responsive mb-4">
    <table class="table table-sm table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Ordre</th>
                <th>Membre</th>
                <th>A bénéficié</th>
                <th>Séance de bénéfice</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${participants}">
                <td th:text="${p.drawOrder}"></td>
                <td th:text="${memberNames[p.memberId]}"></td>
                <td>
                    <span th:if="${p.hasBenefited}" class="badge bg-success">
                        <i class="bi bi-check"></i> Oui
                    </span>
                    <span th:unless="${p.hasBenefited}" class="badge bg-warning text-dark">
                        <i class="bi bi-clock"></i> En attente
                    </span>
                </td>
                <td>
                    <span th:if="${p.sessionId}" th:text="'Séance #' + ${p.sessionId}"></span>
                    <span th:unless="${p.sessionId}" class="text-muted">—</span>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- ── Actions ─────────────────────────────────────────── -->
<div class="d-flex gap-2 mt-3" th:if="${tour.isOpen()}">
    <form th:if="${allBenefited}" th:action="@{/presence-tours/{id}/close(id=${tour.id})}" method="post"
          sec:authorize="hasAuthority('SESSION_CLOSE')"
          onsubmit="return confirm('Clôturer ce tour de présence ? Cette action est irréversible.');">
        <button type="submit" class="btn btn-success">
            <i class="bi bi-check-circle me-1"></i>Clôturer le tour
        </button>
    </form>
    <span th:unless="${allBenefited}" class="text-muted">
        <i class="bi bi-info-circle me-1"></i>Tous les participants doivent avoir bénéficié avant la clôture.
    </span>
</div>

</th:block></body></html>
