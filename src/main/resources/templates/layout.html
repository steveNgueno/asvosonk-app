<!DOCTYPE html>
<html lang="fr"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(pageTitle, content, extraHead, extraScripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle != null ? pageTitle + ' — ASVOSONK' : 'ASVOSONK'}">ASVOSONK</title>

    <!-- Google Fonts: Inter (typographie institutionnelle) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap 5 (CDN — works offline if cached; for full offline: bundle locally) -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom styles -->
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/css/asvosonk.css}">

    <th:block th:replace="${extraHead}"></th:block>
</head>
<body>

<!-- ── Top navigation bar ──────────────────────────────── -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
            <i class="bi bi-people-fill me-2"></i>ASVOSONK
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">

                <!-- Members -->
                <li class="nav-item" sec:authorize="hasAuthority('MEMBER_VIEW')">
                    <a class="nav-link" th:href="@{/members}"
                       th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/members')} ? 'active' : ''">
                        <i class="bi bi-person-lines-fill me-1"></i>Membres
                    </a>
                </li>

                <!-- Sessions (Presence) -->
                <li class="nav-item" sec:authorize="hasAuthority('SESSION_VIEW')">
                    <a class="nav-link" th:href="@{/sessions}"
                       th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/sessions')} ? 'active' : ''">
                        <i class="bi bi-calendar-week me-1"></i>Séances
                    </a>
                </li>

                <!-- Grand Tontine -->
                <li class="nav-item" sec:authorize="hasAuthority('TONTINE_VIEW')">
                    <a class="nav-link" th:href="@{/tontine}"
                       th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/tontine')} ? 'active' : ''">
                        <i class="bi bi-cash-stack me-1"></i>Grande Tontine
                    </a>
                </li>

                <!-- Annual Bank — hidden for SECRETARY -->
                <li class="nav-item" sec:authorize="hasAuthority('BANK_VIEW')">
                    <a class="nav-link" th:href="@{/bank}"
                       th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/bank')} ? 'active' : ''">
                        <i class="bi bi-bank me-1"></i>Banque Annuelle
                    </a>
                </li>

                <!-- Cashboxes -->
                <li class="nav-item" sec:authorize="hasAuthority('CASHBOX_VIEW')">
                    <a class="nav-link" th:href="@{/cashboxes}"
                       th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/cashboxes')} ? 'active' : ''">
                        <i class="bi bi-safe me-1"></i>Caisses
                    </a>
                </li>

                <!-- Sanctions -->
                <li class="nav-item" sec:authorize="hasAuthority('SANCTION_VIEW')">
                    <a class="nav-link" th:href="@{/sanctions}"
                       th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/sanctions')} ? 'active' : ''">
                        <i class="bi bi-exclamation-triangle me-1"></i>Sanctions
                    </a>
                </li>

                <!-- Reports -->
                <li class="nav-item" sec:authorize="hasAuthority('REPORT_SESSION')">
                    <a class="nav-link" th:href="@{/reports}"
                       th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/reports')} ? 'active' : ''">
                        <i class="bi bi-file-earmark-pdf me-1"></i>Rapports
                    </a>
                </li>

                <!-- Search -->
                <li class="nav-item" sec:authorize="hasAuthority('SEARCH_GLOBAL')">
                    <a class="nav-link" th:href="@{/search}"
                       th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/search')} ? 'active' : ''">
                        <i class="bi bi-search me-1"></i>Recherche
                    </a>
                </li>

                <!-- User management — president only -->
                <li class="nav-item" sec:authorize="hasAuthority('USER_VIEW')">
                    <a class="nav-link" th:href="@{/users}"
                       th:classappend="${currentUri != null and #strings.startsWith(currentUri, '/users')} ? 'active' : ''">
                        <i class="bi bi-person-gear me-1"></i>Utilisateurs
                    </a>
                </li>

            </ul>

            <!-- Right side: logged-in user info + logout -->
            <ul class="navbar-nav">                    <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">Utilisateur</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li sec:authorize="isAuthenticated()">
                            <span class="dropdown-item-text text-muted small"
                                  sec:authentication="principal.appUser.role.name">Rôle</span>
                        </li>
                        <li sec:authorize="!isAuthenticated()">
                            <span class="dropdown-item-text text-muted small">Non connecté</span>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ── Flash messages (auto-dismiss after 4s — UI-014) ─── -->
<div class="container-fluid px-3 mt-2" th:if="${successMessage != null}">
    <div class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2"
         role="alert" id="flashSuccess">
        <i class="bi bi-check-circle-fill fs-5"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
</div>
<div class="container-fluid px-3 mt-2" th:if="${errorMessage != null}">
    <div class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2"
         role="alert" id="flashError">
        <i class="bi bi-x-circle-fill fs-5"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ── Page content ────────────────────────────────────── -->
<main class="container-fluid py-3">
    <th:block th:replace="${content}"></th:block>
</main>

<!-- ── Footer ─────────────────────────────────────────── -->
<footer class="bg-dark text-secondary text-center py-2 mt-4 small">
    ASVOSONK — Nkou-Assi &copy; 2024
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
// Auto-dismiss flash messages after 4 seconds (UI-014)
setTimeout(function () {
    ['flashSuccess', 'flashError'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) bootstrap.Alert.getOrCreateInstance(el).close();
    });
}, 4000);
</script>
<th:block th:replace="${extraScripts}"></th:block>
</body>
</html>
