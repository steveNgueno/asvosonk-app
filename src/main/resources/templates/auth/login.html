<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Connexion — ASVOSONK</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/asvosonk.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body class="login-page">

<main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
        <header class="login-head">
            <span class="login-mark" aria-hidden="true"><i class="bi bi-people-fill"></i></span>
            <h1 id="loginTitle">ASVOSONK</h1>
            <p>Nkou-Assi — Gestion financière de l'association</p>
        </header>

        <div class="login-body">

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0" aria-hidden="true"></i>
                <span>Identifiant ou mot de passe incorrect, ou compte verrouillé.</span>
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="status">
                <i class="bi bi-check-circle-fill flex-shrink-0" aria-hidden="true"></i>
                <span>Vous avez été déconnecté.</span>
            </div>
            <div th:if="${param.expired}" class="alert alert-warning" role="status">
                <i class="bi bi-clock-history flex-shrink-0" aria-hidden="true"></i>
                <span>Votre session a expiré. Veuillez vous reconnecter.</span>
            </div>

            <form th:action="@{/login}" method="post" novalidate>
                <!-- Le jeton CSRF est injecté automatiquement par Thymeleaf. -->

                <div class="mb-3">
                    <label for="login" class="form-label">Identifiant</label>
                    <div class="input-group">
                        <span class="input-group-text" aria-hidden="true"><i class="bi bi-person"></i></span>
                        <input type="text" id="login" name="login" class="form-control"
                               autocomplete="username" autocapitalize="none"
                               autofocus required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text" aria-hidden="true"><i class="bi bi-lock"></i></span>
                        <input type="password" id="password" name="password" class="form-control"
                               autocomplete="current-password" required>
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword"
                                aria-label="Afficher le mot de passe" aria-pressed="false">
                            <i class="bi bi-eye" id="eyeIcon" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100 justify-content-center">
                    <i class="bi bi-box-arrow-in-right" aria-hidden="true"></i>Se connecter
                </button>
            </form>
        </div>

        <p class="login-foot">
            Après 3 échecs consécutifs, le compte est temporairement verrouillé.
        </p>
    </section>
</main>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
