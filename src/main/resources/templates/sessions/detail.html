<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(pageTitle=${pageTitle}, content=~{::main-content}, extraHead=~{}, extraScripts=~{})}">
<body><th:block th:fragment="main-content">

<div class="d-flex justify-content-between align-items-center mb-3">
    <div class="page-header">
        <h2><i class="bi bi-calendar-week me-2"></i>Détail de la séance</h2>
        <p th:text="'Séance du ' + ${#temporals.format(session.sessionDate,'EEEE dd MMMM yyyy')}"></p>
    </div>
    <a th:href="@{/sessions}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Retour à la liste
    </a>
</div>

<!-- Session info card -->
<div class="card border-0 shadow-sm mb-3">
    <div class="card-body">
        <div class="row">
            <div class="col-md-3">
                <small class="text-muted d-block">Statut</small>
                <span class="badge fs-6 mt-1"
                      th:classappend="${session.status.name() == 'closed' ? 'bg-secondary' :
                                      (session.status.name() == 'open' ? 'bg-success' : 'bg-info')}"
                      th:text="${session.status.name() == 'closed' ? 'Clôturée' :
                               (session.status.name() == 'open' ? 'Ouverte' : 'Planifiée')}"></span>
            </div>
            <div class="col-md-3">
                <small class="text-muted d-block">Bénéficiaire</small>
                <span class="fw-semibold mt-1 d-block"
                      th:text="${session.beneficiary != null ? session.beneficiary.fullName : 'Non désigné'}"></span>
            </div>
            <div class="col-md-3">
                <small class="text-muted d-block">Date de clôture</small>
                <span class="mt-1 d-block"
                      th:text="${session.closedAt != null ? #temporals.format(session.closedAt, 'dd/MM/yyyy HH:mm') : '—'}"></span>
            </div>
            <div class="col-md-3">
                <small class="text-muted d-block">Ordre du jour</small>
                <span class="mt-1 d-block" th:text="${session.agenda != null ? session.agenda : '—'}"></span>
            </div>
        </div>
    </div>
</div>

<!-- Attendance table -->
<div class="card border-0 shadow-sm">
    <div class="card-header bg-dark text-white fw-semibold d-flex justify-content-between align-items-center">
        <span><i class="bi bi-table me-1"></i>Feuille de présence</span>
        <a sec:authorize="hasAuthority('SESSION_VIEW')"
           th:href="@{/sessions/{id}/report(id=${session.id})}"
           class="btn btn-sm btn-outline-light">
            <i class="bi bi-file-earmark-bar-graph me-1"></i>Voir le rapport complet
        </a>
    </div>
    <div class="table-responsive">
        <table class="table table-sm mb-0">
            <thead>
                <tr>
                    <th>Membre</th>
                    <th class="text-center">Présent</th>
                    <th class="text-end">Montant cotisé</th>
                    <th class="text-center">Statut</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="att : ${attendances}">
                    <td th:text="${att.member.fullName}"></td>
                    <td class="text-center">
                        <span th:if="${att.present}" class="text-success"><i class="bi bi-check-circle-fill"></i> Oui</span>
                        <span th:unless="${att.present}" class="text-danger"><i class="bi bi-x-circle-fill"></i> Non</span>
                    </td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(att.amountPaid, 1, 'COMMA', 0, 'POINT')} + ' FCFA'"></td>
                    <td class="text-center">
                        <span class="badge"
                              th:classappend="${att.attendanceStatus.name() == 'up_to_date' ? 'bg-success' :
                                              (att.attendanceStatus.name() == 'covered_by_fund' ? 'bg-warning text-dark' :
                                              (att.attendanceStatus.name() == 'default_status' ? 'bg-danger' : 'bg-secondary'))}"
                              th:text="${att.attendanceStatus.name() == 'up_to_date' ? 'À jour' :
                                       (att.attendanceStatus.name() == 'covered_by_fund' ? 'Fond' :
                                       (att.attendanceStatus.name() == 'default_status' ? 'Échec' : 'Recouvré'))}"></span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body></html>
