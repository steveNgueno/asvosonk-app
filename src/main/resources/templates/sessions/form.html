<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Nouvelle séance', ~{::main-content}, ~{}, ~{})}">
<body>
<th:block th:fragment="main-content">

<div class="page-head">
    <div>
        <h1><i class="bi bi-calendar-plus" aria-hidden="true"></i>Nouvelle séance</h1>
        <p class="page-subtitle">
            À la création, la feuille de présence est pré-remplie avec tous les membres actifs.
        </p>
    </div>
    <div class="page-actions">
        <a th:href="@{/sessions}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>Retour
        </a>
    </div>
</div>

<div class="card form-panel">
    <div class="card-body">
        <form th:action="@{/sessions/new}" th:object="${sessionForm}" method="post" novalidate>

            <div th:if="${errorMessage != null}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle-fill flex-shrink-0" aria-hidden="true"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <div class="mb-4">
                <label class="form-label req" for="sessionDate">Date de la séance</label>
                <input type="date" id="sessionDate" class="form-control" th:field="*{sessionDate}"
                       th:classappend="${#fields.hasErrors('sessionDate')} ? 'is-invalid'" required>
                <div class="invalid-feedback" th:errors="*{sessionDate}"></div>
                <p class="form-text">Une seule séance peut exister par date.</p>
            </div>

            <div class="mb-4">
                <label class="form-label" for="agenda">Ordre du jour</label>
                <textarea id="agenda" class="form-control" th:field="*{agenda}" rows="4"
                          placeholder="Prière, rapport de la séance précédente, nouvelles des familles, finances, divers…"></textarea>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-lg" aria-hidden="true"></i>Créer la séance
                </button>
                <a th:href="@{/sessions}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

</th:block>
</body>
</html>
