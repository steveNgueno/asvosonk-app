<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Nouvelle séance', content=~{::main-content}, extraHead=~{}, extraScripts=~{})}">
<body><th:block th:fragment="main-content">

<div class="page-header mb-4">
    <h2><i class="bi bi-plus-circle me-2"></i>Nouvelle séance</h2>
</div>

<div class="card border-0 shadow-sm" style="max-width:480px;">
    <div class="card-body p-4">
        <form th:action="@{/sessions/new}" th:object="${sessionForm}" method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Date de la séance *</label>
                <input type="date" class="form-control" th:field="*{sessionDate}"
                       th:classappend="${#fields.hasErrors('sessionDate')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{sessionDate}"></div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Ordre du jour</label>
                <textarea class="form-control" th:field="*{agenda}" rows="3"
                          placeholder="Prière, rapport séance précédente, nouvelles famille, finances, divers..."></textarea>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-check-circle me-1"></i>Créer la séance
                </button>
                <a href="/sessions" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>

</th:block></body></html>
