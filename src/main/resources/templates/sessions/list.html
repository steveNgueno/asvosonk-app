<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
               xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(pageTitle='Séances', content=~{::main-content}, extraHead=~{}, extraScripts=~{})}">
<body><th:block th:fragment="main-content">

<div class="d-flex justify-content-between align-items-center mb-3">
    <div class="page-header">
        <h2><i class="bi bi-calendar-week me-2"></i>Séances</h2>
        <p th:text="${sessions.size()} + ' séances enregistrées'"></p>
    </div>
    <a th:href="@{/sessions/new}" class="btn btn-primary"
       sec:authorize="hasAuthority('SESSION_CREATE')">
        <i class="bi bi-plus-circle me-1"></i>Nouvelle séance
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover mb-0">
            <thead>
                <tr><th>Date</th><th>Bénéficiaire présence</th><th>Statut</th><th></th></tr>
            </thead>
            <tbody>
                <tr th:if="${sessions.empty}">
                    <td colspan="4" class="text-center text-muted py-4">Aucune séance enregistrée</td>
                </tr>
                <tr th:each="s : ${sessions}">
                    <td class="fw-semibold" th:text="${#temporals.format(s.sessionDate,'EEEE dd MMMM yyyy')}"></td>
                    <td th:text="${s.beneficiary?.fullName ?: '—'}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${s.status.name()=='closed'?'bg-success':
                                              (s.status.name()=='open'?'bg-primary':'bg-secondary')}"
                              th:text="${s.status.name()=='closed'?'Clôturée':
                                        (s.status.name()=='open'?'En cours':'Planifiée')}"></span>
                    </td>
                    <td class="text-end">
                        <a th:href="${s.closed ? '/sessions/'+s.id : '/sessions/'+s.id+'/attendance'}"
                           class="btn btn-sm btn-outline-secondary">
                            <i class="bi" th:classappend="${s.closed ? 'bi-eye' : 'bi-pencil-square'}"></i>
                            <span th:text="${s.closed ? 'Rapport' : 'Saisir'}"></span>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block></body></html>
