<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
               xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(${pageTitle}, ~{::main-content}, ~{}, ~{})}">
<body>
<th:block th:fragment="main-content">

<div class="page-head">
    <div>
        <h1><i class="bi bi-calendar-week" aria-hidden="true"></i>Séances</h1>
        <p class="page-subtitle">
            <span th:text="${sessions.size()}">0</span> séance(s) ·
            la progression suit les <span th:text="${totalSteps}">4</span> étapes du déroulé
        </p>
    </div>
    <div class="page-actions" sec:authorize="hasAuthority('SESSION_CREATE')">
        <a th:href="@{/sessions/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>Nouvelle séance
        </a>
    </div>
</div>

<div class="card">
    <div class="table-wrap">
        <table class="table table-hover">
            <caption class="visually-hidden">Liste des séances et de leur avancement</caption>
            <thead>
                <tr>
                    <th scope="col">Date de séance</th>
                    <th scope="col">Progression</th>
                    <th scope="col">Étape courante</th>
                    <th scope="col">Bénéficiaire présence</th>
                    <th scope="col" class="text-end">Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="s : ${sessions}" data-row
                    th:with="stepIdx=${stepIndexMap.get(s.id) != null ? stepIndexMap.get(s.id) : 0},
                             done=${s.getCurrentStepEnum().name() == 'REPORT_GENERATED'}"
                    th:attr="data-href=${done} ? @{/sessions/{id}/report(id=${s.id})} : @{/sessions/{id}(id=${s.id})}">
                    <th scope="row" class="fw-semibold"
                        th:text="${#temporals.format(s.sessionDate,'EEE dd MMM yyyy')}">date</th>
                    <td>
                        <span th:replace="~{fragments/ui :: miniSteps(${displaySteps}, ${stepIdx})}"></span>
                    </td>
                    <td>
                        <!-- L'étape courante (current_step) est la source de vérité de
                             l'avancement : session.status n'est jamais repositionné. -->
                        <span class="pill"
                              th:classappend="${done ? 'pill-success' : (stepIdx == 0 ? 'pill-muted' : 'pill-brand')}">
                            <i class="bi" th:classappend="${s.getCurrentStepEnum().icon}" aria-hidden="true"></i>
                            <span th:text="${s.getCurrentStepEnum().shortLabel}">Étape</span>
                        </span>
                    </td>
                    <td th:text="${s.presenceBeneficiary != null ? s.presenceBeneficiary.fullName : '—'}">—</td>
                    <td class="text-end">
                        <a th:if="${!done}" th:href="@{/sessions/{id}(id=${s.id})}" class="btn btn-sm btn-primary">
                            <i class="bi bi-play-fill" aria-hidden="true"></i>Continuer
                        </a>
                        <a th:if="${done}" th:href="@{/sessions/{id}/report(id=${s.id})}"
                           class="btn btn-sm btn-outline-secondary">
                            <i class="bi bi-file-text" aria-hidden="true"></i>Rapport
                        </a>
                    </td>
                </tr>
                <tr th:if="${sessions.empty}">
                    <td colspan="5">
                        <div th:replace="~{fragments/ui :: empty('bi-calendar-x', 'Aucune séance enregistrée', 'Créez la première séance pour démarrer la saisie de présence.')}"></div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</th:block>
</body>
</html>
