<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<!--
  Fragment réutilisable : aperçu des 4 soldes de caisses (UI-011).
  Usage :
    th:replace="~{fragments/_cashbox-summary :: cashboxSummary(${cashboxTypes}, ${balances})}"
  Paramètres :
    - types    : CashboxType[] (ordre d'affichage : development, sanction, beverage, bank)
    - balances : Map<CashboxType, BigDecimal>
  CashboxType expose name() ∈ {development, sanction, beverage, bank} et label().
-->
<body>
<th:block th:fragment="cashboxSummary(types, balances)">
    <div class="row g-2 mb-3">
        <div class="col-6 col-lg-3" th:each="type : ${types}">
            <div class="cashbox-card card p-2 border-0 shadow-sm"
                 th:classappend="${type.name()}">
                <div class="small text-muted" th:text="${type.label()}">Caisse</div>
                <div class="balance"
                     th:text="${#numbers.formatDecimal(balances.get(type), 1, 'COMMA', 0, 'POINT')} + ' F'">0 F</div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
