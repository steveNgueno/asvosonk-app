<!DOCTYPE html>
<html th:replace="~{layout :: layout(
    pageTitle,
    ~{::content},
    ~{::extraHead},
    ~{::extraScripts}
)}">
<head>
    <th:block th:ref="extraHead"></th:block>
</head>
<body>
<th:block th:ref="content">

<div class="text-center py-5">
    <h1 class="display-1 text-warning fw-bold">403</h1>
    <h2 class="h4 text-secondary mb-3">Accès refusé</h2>
    <p class="text-muted mb-1">Vous n'avez pas les permissions nécessaires pour accéder à cette page.</p>
    <p th:if="${errorDetail != null}" class="text-danger small mb-4" th:text="${errorDetail}"></p>
    <p th:unless="${errorDetail != null}" class="text-muted small mb-4">
        Contactez le président si vous pensez qu'il s'agit d'une erreur.
    </p>
    <a th:href="@{/dashboard}" class="btn btn-primary">
        <i class="bi bi-house-door me-1"></i>Retour au tableau de bord
    </a>
</div>

</th:block>

<th:block th:ref="extraScripts"></th:block>
</body>
</html>
