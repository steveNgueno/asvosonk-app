<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Accès refusé', ~{::main-content}, ~{}, ~{})}">
<body>
<th:block th:fragment="main-content">

<div class="card form-panel mx-auto card-accent card-accent-warning">
    <div class="card-body text-center py-5">
        <p class="mb-2" style="font-size:2.5rem;color:var(--c-warning)" aria-hidden="true">
            <i class="bi bi-shield-lock"></i>
        </p>
        <p class="text-muted mb-1" style="font-size:var(--fs-xs);letter-spacing:.1em">ERREUR 403</p>
        <h1 class="h4">Accès refusé</h1>
        <p class="text-muted mb-1"
           th:text="${errorDetail != null ? errorDetail : 'Permissions insuffisantes pour cette action.'}">
            Vous n'avez pas les permissions nécessaires pour cette action.
        </p>
        <p class="text-muted small">
            Contactez le président si vous pensez qu'il s'agit d'une erreur.
        </p>
        <div class="d-flex gap-2 justify-content-center mt-4">
            <a th:href="@{/dashboard}" class="btn btn-primary">
                <i class="bi bi-house" aria-hidden="true"></i>Tableau de bord
            </a>
        </div>
    </div>
</div>

</th:block>
</body>
</html>
