<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Accès refusé', content=~{::main-content}, extraHead=~{}, extraScripts=~{})}">
<body><th:block th:fragment="main-content">

<div class="text-center py-5">
    <i class="bi bi-shield-lock" style="font-size:5rem;color:var(--color-warning)"></i>
    <h1 class="mt-3 fw-bold" style="font-size:4rem;color:var(--color-warning)">403</h1>
    <h4>Accès refusé</h4>
    <p class="text-muted">Vous n'avez pas les permissions nécessaires pour accéder à cette page.</p>
    <p th:if="${errorDetail != null}" class="text-danger small" th:text="${errorDetail}"></p>
    <p th:unless="${errorDetail != null}" class="text-muted small">
        Contactez le président si vous pensez qu'il s'agit d'une erreur.
    </p>
    <a th:href="@{/dashboard}" class="btn btn-primary mt-2">
        <i class="bi bi-house me-1"></i>Retour au tableau de bord
    </a>
</div>

</th:block></body></html>
