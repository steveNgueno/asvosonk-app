<!DOCTYPE html>
<html th:replace="~{layout :: layout(
    pageTitle,
    ~{::content},
    ~{::extraHead},
    ~{::extraScripts}
)}">
<head>
    <th:block th:ref="extraHead"></th:block>
</head>
<body>
<th:block th:ref="content">

<div class="text-center py-5">
    <h1 class="display-1 text-danger fw-bold">500</h1>
    <h2 class="h4 text-secondary mb-3">Erreur interne du serveur</h2>
    <p class="text-muted mb-1">Une erreur inattendue s'est produite.</p>
    <p th:if="${errorDetail != null}" class="text-danger small mb-4" th:text="${errorDetail}"></p>
    <p th:unless="${errorDetail != null}" class="text-muted small mb-4">
        Veuillez réessayer ou contacter l'administrateur si le problème persiste.
    </p>
    <div class="d-flex gap-2 justify-content-center">
        <a th:href="@{/dashboard}" class="btn btn-primary">
            <i class="bi bi-house-door me-1"></i>Tableau de bord
        </a>
        <a href="javascript:history.back()" class="btn btn-secondary">
            <i class="bi bi-arrow-left me-1"></i>Page précédente
        </a>
    </div>
</div>

</th:block>

<th:block th:ref="extraScripts"></th:block>
</body>
</html>
