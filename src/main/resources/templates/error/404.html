<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout(pageTitle='Page introuvable', content=~{::main-content}, extraHead=~{}, extraScripts=~{})}">
<body><th:block th:fragment="main-content">

<div class="text-center py-5">
    <i class="bi bi-search" style="font-size:5rem;color:var(--color-muted)"></i>
    <h1 class="mt-3 fw-bold" style="font-size:4rem;color:var(--color-muted)">404</h1>
    <h4>Page introuvable</h4>
    <p class="text-muted">La page que vous cherchez n'existe pas ou a été déplacée.</p>
    <p th:if="${errorDetail != null}" class="text-danger small" th:text="${errorDetail}"></p>
    <a th:href="@{/dashboard}" class="btn btn-primary mt-2">
        <i class="bi bi-house me-1"></i>Retour au tableau de bord
    </a>
</div>

</th:block></body></html>
