<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: layout('Page introuvable', ~{::main-content}, ~{}, ~{})}">
<body>
<th:block th:fragment="main-content">

<div class="card form-panel mx-auto">
    <div class="card-body text-center py-5">
        <p class="mb-2" style="font-size:2.5rem;color:var(--c-border-strong)" aria-hidden="true">
            <i class="bi bi-compass"></i>
        </p>
        <p class="text-muted mb-1" style="font-size:var(--fs-xs);letter-spacing:.1em">ERREUR 404</p>
        <h1 class="h4">Cette page n'existe pas</h1>
        <p class="text-muted">La page demandée est introuvable ou a été déplacée.</p>
        <p th:if="${errorDetail != null}" class="pill pill-muted d-inline-flex" th:text="${errorDetail}"></p>
        <div class="d-flex gap-2 justify-content-center mt-4">
            <a th:href="@{/dashboard}" class="btn btn-primary">
                <i class="bi bi-house" aria-hidden="true"></i>Tableau de bord
            </a>
        </div>
    </div>
</div>

</th:block>
</body>
</html>
