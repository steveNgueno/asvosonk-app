<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
               xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(
          pageTitle    = 'Tableau de bord',
          content      = ~{::main-content},
          extraHead    = ~{},
          extraScripts = ~{}
      )}">
<body>
<th:block th:fragment="main-content">

    <!-- Page title -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0">
                <i class="bi bi-speedometer2 me-2"></i>Tableau de bord
            </h2>
            <small class="text-muted">
                Bienvenue, <strong th:text="${userName}">Admin</strong>
                &nbsp;·&nbsp;
                <span th:text="${roleName}">Rôle</span>
                &nbsp;·&nbsp;
                Dernière connexion :
                <span th:text="${lastLogin != null ? #temporals.format(lastLogin, 'dd/MM/yyyy HH:mm') : 'première connexion'}">—</span>
            </small>
        </div>
        <span class="badge bg-success fs-6">
            <i class="bi bi-circle-fill me-1" style="font-size:.5rem"></i>En ligne
        </span>
    </div>

    <!-- Module cards (visibility controlled by permission) -->
    <div class="row g-3">

        <!-- Members -->
        <div class="col-md-4 col-lg-3" sec:authorize="hasAuthority('MEMBER_VIEW')">
            <a th:href="@{/members}" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-primary bg-opacity-10 p-3">
                            <i class="bi bi-person-lines-fill text-primary fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Membres</div>
                            <div class="fw-bold fs-5">Gérer</div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <!-- Sessions -->
        <div class="col-md-4 col-lg-3" sec:authorize="hasAuthority('SESSION_VIEW')">
            <a th:href="@{/sessions}" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-success bg-opacity-10 p-3">
                            <i class="bi bi-calendar-week text-success fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Séances</div>
                            <div class="fw-bold fs-5">Présence &amp; tontine</div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <!-- Grand Tontine -->
        <div class="col-md-4 col-lg-3" sec:authorize="hasAuthority('TONTINE_VIEW')">
            <a th:href="@{/tontine}" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-warning bg-opacity-10 p-3">
                            <i class="bi bi-cash-stack text-warning fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Grande Tontine</div>
                            <div class="fw-bold fs-5">Tours &amp; dettes</div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <!-- Annual Bank -->
        <div class="col-md-4 col-lg-3" sec:authorize="hasAuthority('BANK_VIEW')">
            <a th:href="@{/bank}" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-info bg-opacity-10 p-3">
                            <i class="bi bi-bank text-info fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Banque Annuelle</div>
                            <div class="fw-bold fs-5">Épargnes &amp; emprunts</div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <!-- Cashboxes -->
        <div class="col-md-4 col-lg-3" sec:authorize="hasAuthority('CASHBOX_VIEW')">
            <a th:href="@{/cashboxes}" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-secondary bg-opacity-10 p-3">
                            <i class="bi bi-safe text-secondary fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Caisses</div>
                            <div class="fw-bold fs-5">Soldes &amp; mouvements</div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <!-- Sanctions -->
        <div class="col-md-4 col-lg-3" sec:authorize="hasAuthority('SANCTION_VIEW')">
            <a th:href="@{/sanctions}" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-danger bg-opacity-10 p-3">
                            <i class="bi bi-exclamation-triangle text-danger fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Sanctions</div>
                            <div class="fw-bold fs-5">Impayées &amp; historique</div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <!-- Reports -->
        <div class="col-md-4 col-lg-3" sec:authorize="hasAuthority('REPORT_SESSION')">
            <a th:href="@{/reports}" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-dark bg-opacity-10 p-3">
                            <i class="bi bi-file-earmark-pdf text-dark fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Rapports</div>
                            <div class="fw-bold fs-5">Générer &amp; télécharger</div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

        <!-- Search -->
        <div class="col-md-4 col-lg-3" sec:authorize="hasAuthority('SEARCH_GLOBAL')">
            <a th:href="@{/search}" class="text-decoration-none">
                <div class="card h-100 border-0 shadow-sm">
                    <div class="card-body d-flex align-items-center gap-3">
                        <div class="rounded-circle bg-primary bg-opacity-10 p-3">
                            <i class="bi bi-search text-primary fs-4"></i>
                        </div>
                        <div>
                            <div class="text-muted small">Recherche</div>
                            <div class="fw-bold fs-5">Tous modules</div>
                        </div>
                    </div>
                </div>
            </a>
        </div>

    </div><!-- /row -->

</th:block>
</body>
</html>
