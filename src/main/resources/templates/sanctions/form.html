<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: layout(pageTitle=${pageTitle}, content=~{::main-content}, extraHead=~{}, extraScripts=~{})}">
<body><th:block th:fragment="main-content">

<div class="d-flex justify-content-between align-items-center mb-3">
    <div class="page-header">
        <h2><i class="bi bi-plus-circle me-2"></i>Nouvelle sanction disciplinaire</h2>
        <p>Sanction disciplinaire — Censeur</p>
    </div>
    <a th:href="@{/sanctions}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Retour aux sanctions
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <form th:action="@{/sanctions/new}" th:object="${form}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Membre</label>
                        <select th:field="*{memberId}" class="form-select"
                                th:classappend="${#fields.hasErrors('memberId') ? 'is-invalid' : ''}">
                            <option value="">— Sélectionner un membre —</option>
                            <option th:each="m : ${members}" th:value="${m.id}"
                                    th:text="${m.fullName}"></option>
                        </select>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('memberId')}"
                             th:errors="*{memberId}">Erreur</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Montant (FCFA)</label>
                        <div class="input-group">
                            <input type="number" th:field="*{amount}" class="form-control"
                                   th:classappend="${#fields.hasErrors('amount') ? 'is-invalid' : ''}"
                                   min="1" step="1" placeholder="Montant en FCFA">
                            <span class="input-group-text">FCFA</span>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('amount')}"
                                 th:errors="*{amount}">Erreur</div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Motif</label>
                        <textarea th:field="*{reason}" class="form-control" rows="3"
                                  th:classappend="${#fields.hasErrors('reason') ? 'is-invalid' : ''}"></textarea>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('reason')}"
                             th:errors="*{reason}">Erreur</div>
                    </div>

                    <div class="alert alert-warning mb-3 py-2 small">
                        <i class="bi bi-exclamation-triangle me-1"></i>
                        Sanction disciplinaire — Censeur. Montant libre défini par le bureau.
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-circle me-1"></i>Enregistrer
                        </button>
                        <a th:href="@{/sanctions}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</th:block></body></html>
