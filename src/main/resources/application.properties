# =============================================================
# ASVOSONK — Application configuration
# =============================================================

# ── Server — bind to localhost only ─────────────────────────
server.port=8085
server.address=127.0.0.1

# ── DataSource (PostgreSQL via Docker) ──────────────────────
# Les identifiants correspondent au docker-compose.yaml
spring.datasource.url=jdbc:postgresql://localhost:5433/asvosonk
spring.datasource.username=asvosonk_app
spring.datasource.password=AsvosonkDb@2024
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate ─────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate : Hibernate vérifie que le schéma correspond aux entités
# Flyway gère tous les changements de schéma
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Flyway ──────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ── Thymeleaf ────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── Session — 8 heures (une journée de séance complète) ─────
server.servlet.session.timeout=480m

# ── Logging ─────────────────────────────────────────────────
logging.level.root=WARN
logging.level.org.asvosonk=INFO
logging.level.org.springframework.security=INFO
logging.file.name=logs/asvosonk.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ── Module Rapports (Python — Lot 5) ────────────────────────
asvosonk.reports.exe-path=C:/asvosonk/reports/asvosonk_reports.exe
asvosonk.reports.output-dir=C:/asvosonk/reports/output

# ── Sauvegarde automatique ───────────────────────────────────
# pg_dump cible le conteneur Docker via localhost:5432
asvosonk.backup.output-dir=C:/asvosonk/backup
asvosonk.backup.cron=0 0 23 * * ?
