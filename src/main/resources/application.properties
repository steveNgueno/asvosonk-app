# =============================================================
# ASVOSONK — Application configuration
# =============================================================

# ── Server — bind to localhost only ─────────────────────────
server.port=8085
server.address=127.0.0.1

# ── DataSource (PostgreSQL via Docker) ──────────────────────
# F-12 : les secrets sont externalisés via variables d'environnement.
# Les valeurs après ':' ne sont que des défauts de DÉVELOPPEMENT LOCAL
# (celles du docker-compose). En production, définir OBLIGATOIREMENT
# ASVOSONK_DB_* dans l'environnement — ne jamais committer de secret réel.
spring.datasource.url=${ASVOSONK_DB_URL:jdbc:postgresql://localhost:5433/asvosonk}
spring.datasource.username=${ASVOSONK_DB_USERNAME:asvosonk_app}
spring.datasource.password=${ASVOSONK_DB_PASSWORD:AsvosonkDb@2024}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000

# ── JPA / Hibernate ─────────────────────────────────────────
# Hibernate 6+ auto-detects the dialect; explicit setting is deprecated
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# validate : Hibernate vérifie que le schéma correspond aux entités
# Flyway gère tous les changements de schéma
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# open-in-view=false : éviter les LazyInitializationException silencieuses
# et forcer le chargement explicite dans les services/controlleurs
spring.jpa.open-in-view=false

# ── Flyway ──────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ── Thymeleaf ────────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ── Web / ressources statiques ───────────────────────────────
# Bootstrap et la police d'icônes sont embarqués dans /static/vendor :
# l'application fonctionne sans accès Internet.
#
# L'URL de chaque fichier porte une empreinte de son contenu
# (/js/asvosonk-a1b2c3.js) : le cache navigateur peut donc être long sans
# risquer de servir une feuille de style ou un script périmé après une
# mise à jour — l'empreinte change, l'URL aussi. Les liens sont réécrits
# automatiquement dans les gabarits et dans les CSS.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=7d
spring.web.resources.cache.cachecontrol.cache-public=true

# ── Session — 8 heures (une journée de séance complète) ─────
server.servlet.session.timeout=480m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# À activer en production derrière HTTPS : le cookie de session ne doit
# alors plus transiter en clair.
# server.servlet.session.cookie.secure=true

# ── Erreurs ─────────────────────────────────────────────────
# Ne jamais renvoyer de stacktrace ni de message technique au navigateur :
# les pages error/40x et error/500 affichent un message métier neutre.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.whitelabel.enabled=false

# ── Logging ─────────────────────────────────────────────────
logging.level.root=WARN
logging.level.org.asvosonk=INFO
logging.level.org.springframework.security=INFO
logging.file.name=logs/asvosonk.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ── Module Rapports (Python — Lot 5) ────────────────────────
asvosonk.reports.exe-path=C:/asvosonk/reports/asvosonk_reports.exe
asvosonk.reports.output-dir=C:/asvosonk/reports/output

# ── Sauvegarde automatique ───────────────────────────────────
# pg_dump cible le conteneur Docker via localhost:5432
asvosonk.backup.output-dir=C:/asvosonk/backup
asvosonk.backup.cron=0 0 23 * * ?
